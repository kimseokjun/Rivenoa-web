<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리베노아 테스트판</title>
<p id="status">리베노아 최신 테스트판을 불러오는 중…</p>
<script>
(async () => {
  const response = await fetch('./build.json?t=' + Date.now(), {cache: 'no-store'});
  if (!response.ok) throw new Error('Build manifest unavailable');
  const build = await response.json();
  if (!/^[0-9a-f]{40}$/.test(build.source_sha)) throw new Error('Invalid build SHA');
  const target = new URL('./rivenoa-' + build.source_sha + '.html', location.href);
  sessionStorage.removeItem('rivenoa-auth-callback');
  history.replaceState(null, '', location.pathname);
  location.replace(target);
})().catch(() => {
  document.getElementById('status').textContent = '테스트판을 불러오지 못했습니다. 새로고침해서 다시 시도하세요.';
});
</script>
</html>
