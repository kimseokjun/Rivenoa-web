<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rivenoa staging</title>
<p id="status">Loading the latest Rivenoa staging build…</p>
<script>
(async () => {
  const response = await fetch('./build.json?t=' + Date.now(), {cache: 'no-store'});
  if (!response.ok) throw new Error('Build manifest unavailable');
  const build = await response.json();
  if (!/^[0-9a-f]{40}$/.test(build.source_sha)) throw new Error('Invalid build SHA');
  location.replace('./rivenoa-' + build.source_sha + '.html');
})().catch(() => {
  document.getElementById('status').textContent = 'Staging build unavailable. Reload to retry.';
});
</script>
</html>
